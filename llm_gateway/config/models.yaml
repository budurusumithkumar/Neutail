routes:
  intent_detection:
    logical_model: fast
    primary_model: nvidia_nim/z-ai/glm-5.3
    fallback_model: nvidia_nim/openai/gpt-oss-20b
    prompt_group: intent
    default_prompt_version: v1
    policy:
      temperature: 0.0
      max_tokens: 180
      timeout_seconds: 10
      allow_fallback: true
      structured_output_retries: 1
      log_request_body: false
      log_response_body: false

