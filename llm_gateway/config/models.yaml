routes:
  intent_detection:
    logical_model: fast
    primary_model: gemini/gemini-2.5-flash
    fallback_model: openai/gpt-5-mini
    prompt_group: intent
    default_prompt_version: v1
    policy:
      temperature: 0.0
      max_tokens: 180
      timeout_seconds: 10
      allow_fallback: true
      structured_output_retries: 1
      log_request_body: false
      log_response_body: false

  product_explanation:
    logical_model: general
    primary_model: openai/gpt-5
    fallback_model: gemini/gemini-2.5-pro
    prompt_group: discovery
    default_prompt_version: v1
    policy:
      temperature: 0.3
      max_tokens: 300
      timeout_seconds: 15
      allow_fallback: true
      structured_output_retries: 1
      log_request_body: false
      log_response_body: false

  fit_explanation:
    logical_model: general
    primary_model: openai/gpt-5
    fallback_model: gemini/gemini-2.5-pro
    prompt_group: fit
    default_prompt_version: v1
    policy:
      temperature: 0.2
      max_tokens: 250
      timeout_seconds: 15
      allow_fallback: true
      structured_output_retries: 1
      log_request_body: false
      log_response_body: false

  upsell_message:
    logical_model: fast
    primary_model: gemini/gemini-2.5-flash
    fallback_model: openai/gpt-5-mini
    prompt_group: upsell
    default_prompt_version: v1
    policy:
      temperature: 0.35
      max_tokens: 180
      timeout_seconds: 10
      allow_fallback: true
      structured_output_retries: 1
      log_request_body: false
      log_response_body: false

  optional_summary:
    logical_model: fast
    primary_model: openai/gpt-5-mini
    fallback_model: ollama/llama3.2
    prompt_group: summary
    default_prompt_version: v1
    policy:
      temperature: 0.2
      max_tokens: 220
      timeout_seconds: 15
      allow_fallback: true
      structured_output_retries: 1
      log_request_body: false
      log_response_body: false

  response_synthesis:
    logical_model: fast
    primary_model: openai/gpt-5-mini
    fallback_model: gemini/gemini-2.5-flash
    prompt_group: response
    default_prompt_version: v1
    policy:
      temperature: 0.2
      max_tokens: 240
      timeout_seconds: 12
      allow_fallback: true
      structured_output_retries: 0
      log_request_body: false
      log_response_body: false
