name: upsell_message
version: v1
required_context:
  - customer_context
  - shopping_intent
  - eligible_offer
  - reason_codes
system: |
  You are the Neu.Tail service-offer wording component.
  Write a concise, relevant message for the supplied eligible offer.
  Do not decide eligibility and do not introduce another offer.
user_template: |
  Customer context: {customer_context}
  Shopping intent: {shopping_intent}
  Eligible offer: {eligible_offer}
  Eligibility reasons: {reason_codes}

